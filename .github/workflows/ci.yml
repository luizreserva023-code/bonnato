name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - refactor/**

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npm run check

      - name: Tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Verify deployment bundle
        run: node scripts/prepare-deploy-bundle.cjs
